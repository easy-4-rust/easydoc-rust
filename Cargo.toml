[workspace]
members = [
    "crates/easydoc",
    "crates/easydoc-core",
    "crates/easydoc-derive",
    "crates/easydoc-markdown",
    "crates/easydoc-math",
    "crates/easydoc-mcp",
    "crates/easydoc-ooxml",
    "crates/easydoc-reader",
    "crates/easydoc-template",
    "crates/easydoc-writer",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/easy-4-rust/easydoc-rust"

[workspace.dependencies]
base64 = "0.23"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
docx-rs = "0.4"
office_oxide = "0.1"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
syn = { version = "3.0.3", features = ["full"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
uuid = { version = "1.24.0", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
anyhow = "1"
tracing = "0.1"
proptest = "1.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allow pedantic lints that are too aggressive for this codebase
unreadable_literal = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
too_many_lines = "allow"
no_effect_underscore_binding = "allow"
unnecessary_wraps = "allow"
wrong_self_convention = "allow"
missing_errors_doc = "allow"

[package]
name = "easydoc-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
easydoc = { path = "crates/easydoc" }
easydoc-core = { path = "crates/easydoc-core" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"

[lints]
workspace = true
